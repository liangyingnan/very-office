    <!-- splash -->



    <style type="text/css">

        .theme-dark {

            --romb-start-color: #555;

        }



        .loadmask {

            left: 0;

            top: 0;

            position: absolute;

            height: 100%;

            width: 100%;

            overflow: hidden;

            border: none;

            background-color: #f4f4f4;

            z-index: 1002;

        }



        .loader-page {

            width: 100%;

            height: 170px;

            bottom: 42%;

            position: absolute;

            text-align: center;

            line-height: 10px;

        }



        .loader-logo {

            max-height: 160px;

            margin-bottom: 10px;

        }



        .loader-page-romb {

            width: 40px;

            display: inline-block;

        }



        .loader-page-text {

            width: 100%;

            bottom: 42%;

            position: absolute;

            text-align: center;

            color: #888;

            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;

            line-height: 20px;

        }



        .loader-page-text-loading {

            font-size: 14px;

        }



        .loader-page-text-customer {

            font-size: 16px;

            margin-bottom: 5px;

        }



        .theme-dark .loadmask {

            background-color: #555;

        }



        .theme-dark .loader-page-text {

            color: rgba(255, 255, 255, 0.8);

        }



        .romb {

            width: 40px;

            height: 40px;

            -webkit-transform: rotate(135deg) skew(20deg, 20deg);

            -moz-transform: rotate(135deg) skew(20deg, 20deg);

            -ms-transform: rotate(135deg) skew(20deg, 20deg);

            -o-transform: rotate(135deg) skew(20deg, 20deg);

            position: absolute;

            background: red;

            border-radius: 6px;

            -webkit-animation: movedown 3s infinite ease;

            -moz-animation: movedown 3s infinite ease;

            -ms-animation: movedown 3s infinite ease;

            -o-animation: movedown 3s infinite ease;

            animation: movedown 3s infinite ease;

        }



        #blue {

            z-index: 3;

            background: #55bce6;

            -webkit-animation-name: blue;

            -moz-animation-name: blue;

            -ms-animation-name: blue;

            -o-animation-name: blue;

            animation-name: blue;

        }



        #red {

            z-index:1;

            background: #de7a59;

            -webkit-animation-name: red;

            -moz-animation-name: red;

            -ms-animation-name: red;

            -o-animation-name: red;

            animation-name: red;

        }



        #green {

            z-index: 2;

            background: #a1cb5c;

            -webkit-animation-name: green;

            -moz-animation-name: green;

            -ms-animation-name: green;

            -o-animation-name: green;

            animation-name: green;

        }



        @-webkit-keyframes red {

              0%    { top:120px; background: #de7a59; }

             10%    { top:120px; background: #F2CBBF; }

             14%    { background: #f4f4f4; background: var(--romb-start-color,#f4f4f4); top:120px; }

             15%    { background: #f4f4f4; background: var(--romb-start-color,#f4f4f4); top:0;}

             20%    { background: #E6E4E4; }

             30%    { background: #D2D2D2; }

             40%    { top:120px; }

            100%    { top:120px; background: #de7a59; }

        }



        @keyframes red {

              0%    { top:120px; background: #de7a59; }

             10%    { top:120px; background: #F2CBBF; }

             14%    { background: #f4f4f4; background: var(--romb-start-color,#f4f4f4); top:120px; }

             15%    { background: #f4f4f4; background: var(--romb-start-color,#f4f4f4); top:0;}

             20%    { background: #E6E4E4; }

             30%    { background: #D2D2D2; }

             40%    { top:120px; }

            100%    { top:120px; background: #de7a59; }

        }



        @-webkit-keyframes green {

              0%    { top:110px; background: #a1cb5c; opacity:1; }

             10%    { top:110px; background: #CBE0AC; opacity:1; }

             14%    { background: #f4f4f4; top:110px; background: var(--romb-start-color,#f4f4f4); opacity:1; }

             15%    { background: #f4f4f4; top:0; background: var(--romb-start-color,#f4f4f4); opacity:1; }

             20%    { background: #f4f4f4; top:0; background: var(--romb-start-color,#f4f4f4); opacity:0; }

             25%    { background: #EFEFEF; top:0; opacity:1; }

             30%    { background:#E6E4E4; }

             70%    { top:110px; }

            100%    { top:110px; background: #a1cb5c; }

        }



        @keyframes green {

              0%    { top:110px; background: #a1cb5c; opacity:1; }

             10%    { top:110px; background: #CBE0AC; opacity:1; }

             14%    { background: #f4f4f4; top:110px; background: var(--romb-start-color,#f4f4f4); opacity:1; }

             15%    { background: #f4f4f4; top:0; background: var(--romb-start-color,#f4f4f4); opacity:1; }

             20%    { background: #f4f4f4; top:0; background: var(--romb-start-color,#f4f4f4); opacity:0; }

             25%    { background: #EFEFEF; top:0; opacity:1; }

             30%    { background:#E6E4E4; }

             70%    { top:110px; }

            100%    { top:110px; background: #a1cb5c; }

        }



        @-webkit-keyframes blue {

              0%    { top:100px; background: #55bce6; opacity:1; }

             10%    { top:100px; background: #BFE8F8; opacity:1; }

             14%    { background: #f4f4f4; background: var(--romb-start-color,#f4f4f4); top:100px; opacity:1; }

             15%    { background: #f4f4f4; background: var(--romb-start-color,#f4f4f4); top:0; opacity:1; }

             20%    { background: #f4f4f4; background: var(--romb-start-color,#f4f4f4); top:0; opacity:0; }

             25%    { background: #f4f4f4; background: var(--romb-start-color,#f4f4f4); top:0; opacity:0; }

             45%    { background: #EFEFEF; top:0; opacity:0.2; }

            100%    { top:100px; background: #55bce6; }

        }



        @keyframes blue {

              0%    { top:100px; background: #55bce6; opacity:1; }

             10%    { top:100px; background: #BFE8F8; opacity:1; }

             14%    { background: #f4f4f4; background: var(--romb-start-color,#f4f4f4); top:100px; opacity:1; }

             15%    { background: #f4f4f4; background: var(--romb-start-color,#f4f4f4); top:0; opacity:1; }

             20%    { background: #f4f4f4; background: var(--romb-start-color,#f4f4f4); top:0; opacity:0; }

             25%    { background: #f4f4f4; background: var(--romb-start-color,#f4f4f4); top:0; opacity:0; }

             45%    { background: #EFEFEF; top:0; opacity:0.2; }

            100%    { top:100px; background: #55bce6; }

        }

    <script>

        var userAgent = navigator.userAgent.toLowerCase(),

            check = function(regex){ return regex.test(userAgent); },

            isIEBrowser = !check(/opera/) && (check(/msie/) || check(/trident/)),

            stopLoading = false;

        if (isIEBrowser) {

            var m = /msie (\d+\.\d+)/.exec(userAgent);

            if (m && parseFloat(m[1]) < 10.0) {

                document.write('<div class="app-error-panel">' +

                                '<div class="message-block">' +

                                    '<div class="message-inner">' +

                                        '<div class="title">Your browser is not supported.</div>' +

                                        '<div class="text">Sorry, PDF Editor is currently only supported in the latest versions of the Chrome, Firefox, Safari or Internet Explorer web browsers.</div>' +

                                    '</div>' +

                                '</div></div>');

                stopLoading = true;

            }

        } else

        if (check(/windows\snt/i)) {

            var re = /chrome\/(\d+)/i.exec(userAgent);

            if (!!re && !!re[1] && !(re[1] > 49)) {

                setTimeout(function () {

                    document.getElementsByTagName('body')[0].className += "winxp";

                },0);

            }

        }



        function getUrlParams() {

            var e,

                a = /\+/g,  // Regex for replacing addition symbol with a space

                r = /([^&=]+)=?([^&]*)/g,

                d = function (s) { return decodeURIComponent(s.replace(a, " ")); },

                q = window.location.search.substring(1),

                urlParams = {};



            while (e = r.exec(q))

                urlParams[d(e[1])] = d(e[2]);



            return urlParams;

        }



        function encodeUrlParam(str) {

            return str.replace(/"/g, '&quot;')

                    .replace(/'/g, '&#39;')

                    .replace(/</g, '&lt;')

                    .replace(/>/g, '&gt;');

        }



        var params = getUrlParams(),

            lang = (params["lang"] || 'en').split(/[\-\_]/)[0],

            customer = params["customer"] ? ('<div class="loader-page-text-customer">' + encodeUrlParam(params["customer"]) + '</div>') : '',

            margin = (customer !== '') ? 50 : 20,

            loading = 'Loading...',

            logo = params["logo"] ? ((params["logo"] !== 'none') ? ('<img src="' + encodeUrlParam(params["logo"]) + '" class="loader-logo" />') : '') : null,

            isForm = params["isForm"];



        window.frameEditorId = params["frameEditorId"];

        window.parentOrigin = params["parentOrigin"];



        if ( lang == 'de')      loading = 'Ladevorgang...';

        else if ( lang == 'es') loading = 'Cargando...';

        else if ( lang == 'fr') loading = 'Chargement en cours...';

        else if ( lang == 'it') loading = 'Caricamento in corso...';

        else if ( lang == 'pt') loading = 'Carregando...';

        else if ( lang == 'ru') loading = 'Загрузка...';

        else if ( lang == 'sl') loading = 'Nalaganje...';

        else if ( lang == 'tr') loading = 'Yükleniyor...';

        else if ( lang == 'bg') loading = 'Зареждане...';

        else if ( lang == 'cs') loading = 'Nahrávám...';

        else if ( lang == 'hu') loading = 'Betöltés...';

        else if ( lang == 'ja') loading = '読み込み中...';

        else if ( lang == 'ko') loading = '로드 중...';

        else if ( lang == 'lv') loading = 'Ieladēšana ...';

        else if ( lang == 'nl') loading = 'Laden...';

        else if ( lang == 'pl') loading = 'Ładowanie...';

        else if ( lang == 'sk') loading = 'Nahrávam...';

        else if ( lang == 'uk') loading = 'Завантаження...';

        else if ( lang == 'vi') loading = 'Đang tải...';

        else if ( lang == 'zh') loading = '加载中...';



        if ( !stopLoading )

            document.write(

                '<div id="loading-mask" class="loadmask">' +

                    '<div class="loader-page" style="margin-bottom: ' + margin + 'px;' + ((logo!==null) ? 'height: auto;' : '') + '">' +

                        ((logo!==null) ? logo :

                        '<div class="loader-page-romb">' +

                            '<div class="romb" id="blue"></div>' +

                            '<div class="romb" id="green"></div>' +

                            '<div class="romb" id="red"></div>' +

                        '</div>') +

                    '</div>' +

                    '<div class="loader-page-text">' +  customer +

                        '<div class="loader-page-text-loading">' + loading + '</div>' +

                    '</div>' +

                '</div>');

    </script>

+function init_themes() {

    let localstorage;

    const local_storage_available = +function () {

        try {

            return !!(localstorage = window.localStorage);

        } catch (e) {

            console.warn('localStorage is unavailable');

            localstorage = {

                getItem: function (key) {return null;},

            };

            return false;

        }

    }();



    !window.uitheme && (window.uitheme = {});



    window.uitheme.DEFAULT_LIGHT_THEME_ID = !window.isIEBrowser ? 'theme-white' : 'theme-classic-light';

    window.uitheme.DEFAULT_DARK_THEME_ID = !window.isIEBrowser ? 'theme-night' : 'theme-dark';



    window.uitheme.set_id = function (id) {

        if ( id == 'theme-system' )

            this.adapt_to_system_theme();

        else this.id = id;

    }



    window.uitheme.is_theme_system = function () {

        return this.id == 'theme-system';

    }



    window.uitheme.adapt_to_system_theme = function () {

        this.id = 'theme-system';

        this.type = this.is_system_theme_dark() ? 'dark' : 'light';

    }



    window.uitheme.relevant_theme_id = function () {

        if ( this.is_theme_system() )

            return this.is_system_theme_dark() ? window.uitheme.DEFAULT_DARK_THEME_ID : window.uitheme.DEFAULT_LIGHT_THEME_ID;

        return this.id;

    }



    if ( !window.uitheme.is_system_theme_dark )

        window.uitheme.is_system_theme_dark = function () {

            return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

        }



    // localstorage.setItem('ui-theme-id', 'theme-white');

    !window.uitheme.id && window.uitheme.set_id(localstorage.getItem("ui-theme-id"));

    window.uitheme.iscontentdark = localstorage.getItem("content-theme") == 'dark';



    function inject_style_tag(content, id) {

        if ( id && !!document.getElementById(id) )

            return;



        const style = document.createElement('style');

        style.type = 'text/css';

        style.innerHTML = content;

        if (id) style.id = id;

        document.getElementsByTagName('head')[0].appendChild(style);

    }



    window.uitheme.apply_icons_from_url = function (themeid, url) {

        if ( !url ) return;



        let base_url = !url.endsWith('/') ? url + '/' : url;

        const sp_names = ['small', 'big', 'huge'];

        const sp_scale = {'100':'', '125':'@1.25x','150':'@1.5x','175':'@1.75x','200':'@2x'};

        let icons = [];

        sp_names.forEach(function (n) {

            for (let key in sp_scale) {

                const value = sp_scale[key];

                icons.push('--sprite-button-'+n+'-'+key+':url('+ base_url +'icons' + n + value + '.png)');

            }

        });



        inject_style_tag('.' + themeid + '{' + icons.join(';') + ';}', themeid);



        // workaroud for svg sptites relative path that different from png sprites

        if ( base_url.lastIndexOf('../img/', 0) === 0 )

            base_url = base_url.replace('..','./resources');



        if ( window.Common && window.Common.Utils )

            window.Common.Utils.injectSvgIcons([base_url + 'iconssmall@2.5x.svg', base_url + 'iconsbig@2.5x.svg', base_url + 'iconshuge@2.5x.svg', '../../common/main/resources/img/doc-formats/formats@2.5x.svg'], true);

        else {

            window.uitheme.svg_icons = [base_url + 'iconssmall@2.5x.svg', base_url + 'iconsbig@2.5x.svg', base_url + 'iconshuge@2.5x.svg'];

        }

    }



    inject_style_tag(':root .theme-dark {' +

                                '--toolbar-header-document: #2a2a2a; --toolbar-header-spreadsheet: #2a2a2a;' +

                                '--toolbar-header-presentation: #2a2a2a; --toolbar-header-pdf: #2a2a2a; --toolbar-header-visio: #2a2a2a;}' +

                            ':root .theme-contrast-dark {' +

                                '--toolbar-header-document: #1e1e1e; --toolbar-header-spreadsheet: #1e1e1e;' +

                                '--toolbar-header-presentation: #1e1e1e; --toolbar-header-pdf: #1e1e1e; --toolbar-header-visio: #1e1e1e;}');



    let objtheme = window.uitheme.colors ? window.uitheme : localstorage.getItem("ui-theme");

    const header_tokens = ['toolbar-header-document', 'toolbar-header-spreadsheet', 'toolbar-header-presentation', 'toolbar-header-pdf', 'toolbar-header-visio'];

    if ( !!objtheme ) {

        if ( typeof(objtheme) == 'string' && objtheme.lastIndexOf("{", 0) === 0 &&

                objtheme.indexOf("}", objtheme.length - 1) !== -1 )

        {

            objtheme = JSON.parse(objtheme);

        }



        if ( objtheme ) {

            if ( window.uitheme.id && window.uitheme.id != objtheme.id ) {

                local_storage_available && localstorage.removeItem("ui-theme");

                !window.uitheme.type && /-dark/.test(window.uitheme.id) && (window.uitheme.type = 'dark');

            } else {

                window.uitheme.cache = objtheme;

                if ( !window.uitheme.type && objtheme.type ) {

                    window.uitheme.type = objtheme.type;

                }



                if ( objtheme.colors ) {

                    header_tokens.forEach(function (i) {

                            !!objtheme.colors[i] && document.documentElement.style.setProperty('--' + i, objtheme.colors[i]);

                        });



                    let colors = [];

                    for (let c in objtheme.colors) {

                        colors.push('--' + c + ':' + objtheme.colors[c]);

                    }



                    inject_style_tag('.' + objtheme.id + '{' + colors.join(';') + ';}');

                }



                if ( objtheme.icons && !(window.uitheme.embedicons === true) ) {

                    window.uitheme.apply_icons_from_url(objtheme.id, objtheme.icons.basepath);

                }



                if ( objtheme.skeleton ) {

                    if ( objtheme.skeleton.css )

                        inject_style_tag(objtheme.skeleton.css);



                    if ( objtheme.skeleton.html ) {

                        window.skhtml = objtheme.skeleton.html;

                    }

                }

            }

        }

    } else {

        if ( window.uitheme.id && window.uitheme.id.lastIndexOf("theme-gray", 0) === 0 ) {

            header_tokens.forEach(function (i) {

                !!document.documentElement.style.setProperty('--' + i, "#f7f7f7");

            });

        } else if ( window.uitheme.id && window.uitheme.id.lastIndexOf("theme-white", 0) === 0 ) {

            header_tokens.forEach(function (i) {

                !!document.documentElement.style.setProperty('--' + i, "#ffffff");

            });

        }

    }

}();


</script>

function isExtendedPDFFile(text) {

    if (!text) {

        return false;

    }

    const indexFirst = text.indexOf('%\xCD\xCA\xD2\xA9\x0D');

    if (indexFirst === -1) {

        return false;

    }



    let pFirst = text.substring(indexFirst + 6);



    if (!(pFirst.lastIndexOf('1 0 obj\x0A<<\x0A', 0) === 0)) {

        return false;

    }



    pFirst = pFirst.substring(11);



    let signature = 'ONLYOFFICEFORM';

    const indexMeta = pFirst.indexOf(signature);



    if (indexStream === -1 || indexMeta === -1 || indexStream < indexMeta) {

    let pMeta = pFirst.substring(indexMeta);

    pMeta = pMeta.substring(signature.length + 3);



    let indexMetaLast = pMeta.indexOf(' ');

    if (indexMetaLast === -1) {

    }



    pMeta = pMeta.substring(indexMetaLast + 1);



    indexMetaLast = pMeta.indexOf(' ');

    if (indexMetaLast === -1) {

var startCallback;

var eventFn = function(msg) {

    if (msg.origin !== window.parentOrigin && msg.origin !== window.location.origin && !(msg.origin==="null" && (window.parentOrigin==="file://" || window.location.origin==="file://"))) return;



    var data = msg.data;

    if (Object.prototype.toString.apply(data) !== '[object String]' || !window.JSON) {

        return;

    }

    try {

        data = window.JSON.parse(data)

    } catch(e) {

        data = '';

    }



    if (data && data.command==="checkParams") {

        data = data.data || {};

        checkExtendedPDF(data.directUrl, data.key, data.url, data.token, startCallback);

        _unbindWindowEvents();

    }

};



var _bindWindowEvents = function() {

    if (window.addEventListener) {

        window.addEventListener("message", eventFn, false)

    } else if (window.attachEvent) {

        window.attachEvent("onmessage", eventFn);

    }

};



var _unbindWindowEvents = function() {

    if (window.removeEventListener) {

        window.removeEventListener("message", eventFn)

    } else if (window.detachEvent) {

        window.detachEvent("onmessage", eventFn);

    }

};



function listenApiMsg(callback) {

    startCallback = callback;

    _bindWindowEvents();

}


</script>

    <script>

        function startApp() {

            var script = document.createElement("script");

            script.src = "../../../vendor/requirejs/require.js";



            if (isIEBrowser === true) {

                (document.write('<script src="../../common/main/lib/util/fix-ie-compat.js"><\/script>'),

                document.write('<script src="../../../../sdkjs/vendor/string.js"><\/script>'));



                setTimeout(function(){

                    script.setAttribute("data-main", "ie/app");

                    document.body.appendChild(script);

                },0);

            } else {

                script.setAttribute("data-main", "app");

                document.body.appendChild(script);

            }

        }

        if (isForm===undefined) {

            listenApiMsg(function (isform) {

                window.isPDFForm = !!isform;

                startApp();

            });

        } else {

            window.isPDFForm = isForm==='true';

            startApp();

        }

    </script>
